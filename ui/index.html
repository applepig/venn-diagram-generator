<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 其餘 meta（og、canonical、robots、JSON-LD）由 server 依 ?s= 內容注入 -->
    <title>文氏圖產生器</title>
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel"></aside>
      <main class="stage">
        <div class="canvas-wrap">
          <div class="canvas" id="canvas"></div>
        </div>
      </main>
      <!-- 窄版面才出現：捲過大圖之後黏在頂端，點一下放大成 overlay -->
      <div class="peek">
        <div class="canvas-wrap">
          <div class="canvas" id="canvas-mini"></div>
        </div>
        <p class="peek-hint">預覽 · 點一下放大</p>
        <button type="button" class="preview-close">關閉預覽</button>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
