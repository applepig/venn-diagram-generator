<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="left">
      <circle cx="12.5" cy="16" r="8.5" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#fafafa" />
