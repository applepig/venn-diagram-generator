services:
  venn:
    build:
      # context 是 repo 根目錄，Dockerfile 住在 deploy/
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: venn-diagram-generator
    restart: unless-stopped
    environment:
      - PORT=3000
      # og:image／og:url 的 origin 鎖死在這，不讓 X-Forwarded-Host 決定
      - PUBLIC_ORIGIN=https://venn.applepig.net
      # 只有正式站注入 GTM；開發站（compose.dev.yml）刻意不給，數據才不會混進來
      - VENN_GTM_ID=GTM-KTZKC8CH
      # 圖片右下角的浮水印文字；沒設就不畫（fork 的站換成自己的網址）
      - VENN_WATERMARK=venn.applepig.net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.venn.rule=Host(`venn.applepig.net`)"
      - "traefik.http.routers.venn.entrypoints=web"
      - "traefik.http.services.venn.loadbalancer.server.port=3000"
    networks:
      - web

networks:
  web:
    external: true
