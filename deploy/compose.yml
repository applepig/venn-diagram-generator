services:
  venn:
    build:
      # context 是 repo 根目錄，Dockerfile 住在 deploy/
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: venn-diagram-generator
    restart: unless-stopped
    environment:
      - PORT=3000
      # og:image／og:url 的 origin 鎖死在這，不讓 X-Forwarded-Host 決定
      - PUBLIC_ORIGIN=https://${VENN_PUBLIC_HOST:?set VENN_PUBLIC_HOST to the public hostname}
      # GTM 沒預設值：不給就不注入（開發站刻意不給，數據才不會混進來）
      - VENN_GTM_ID=${VENN_GTM_ID:-}
      # 圖片右下角的浮水印文字；沒設就不畫
      - VENN_WATERMARK=${VENN_WATERMARK:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.venn.rule=Host(`${VENN_PUBLIC_HOST:?set VENN_PUBLIC_HOST to the public hostname}`)"
      - "traefik.http.routers.venn.entrypoints=web"
      - "traefik.http.services.venn.loadbalancer.server.port=3000"
    networks:
      - web

networks:
  web:
    external: true
